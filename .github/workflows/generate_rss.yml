name: Generate RSS Feed

on:
  schedule:
    # 中国時間 金曜日 14:30 = UTC 金曜日 06:30
    - cron: '30 6 * * 5'
  workflow_dispatch:  # 手動実行も可能

# ★ 権限を明示的に設定 ★
permissions:
  contents: write  # リポジトリの内容を書き込む権限
  actions: write   # keepalive アクションが GitHub API を利用するために必要

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # rebase を安全に行うため全履歴を取得
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run RSS generator
        run: python generate_rss.py
        
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
          # プッシュ前にリモートの変更を取り込む（競合回避）
          git pull --rebase origin ${{ github.ref_name }}
          git push
      
      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
